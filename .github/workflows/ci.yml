name: ci
run-name: ${{ inputs.release && 'release' || 'ci' }} ${{ github.ref_name }} ${{ github.sha }}

# One pipeline. Every push builds the release once (the npm tarball, a bundle per platform, the installers and
# the website), tests those files and installs them on every platform. A release builds and tests nothing: a
# dispatch with `release` checked takes the `release` artifact of the green push run of the same commit, checks
# it, and `publish` ships it once the owner approves the `release` environment. See scripts/release/README.md.
on:
  push:
    branches: ['v[0-9][0-9][0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the release its green push run built and tested for this commit, once the release environment is approved
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release && 'release' || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Lint compares the site's docs snapshot with the commit it is pinned to, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, GUI check and hub check
        run: node scripts/ci.mjs check

  build:
    name: build
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Node archives are pinned by SHA-256 in scripts/release/node-runtime.json and checked on every use.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/pancode-node-cache
          key: node-runtime-${{ hashFiles('scripts/release/node-runtime.json') }}
      - name: Build the npm tarball, every bundle, the installers and the website
        run: node scripts/release/build.mjs --out "$RUNNER_TEMP/release" --targets all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          # The bundles are gzip already, and the website carries .nojekyll.
          compression-level: 0
          include-hidden-files: true
          retention-days: 14

  test:
    name: ci (${{ matrix.node }})
    if: ${{ !inputs.release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Both supported majors run the same tests: 0.7.0 passed a Node 24-only check and failed on Node 22.
        node: [22, 24]
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release
      # ripgrep and fd come from archives pinned by SHA-256 in scripts/ci-tools.mjs, never from apt.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/pancode-search-tools
          key: search-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-tools.mjs') }}
      # The state-file-lock pid-namespace contracts skip unless `unshare -Urpf` works; Ubuntu 24.04 blocks it through
      # AppArmor. Each key is set only where the kernel has it, and the probe fails this step instead of a silent skip.
      - name: Allow unprivileged user namespaces
        run: |
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key="${setting%%=*}"
            if test -e "/proc/sys/${key//.//}"; then sudo sysctl -w "$setting"; fi
          done
          unshare -Urpf --kill-child --mount-proc true
      - name: Contracts, GUI behavior and the installed npm package, against the built tarball
        run: node scripts/ci.mjs test "$RUNNER_TEMP/release"

  install:
    name: install (${{ matrix.target }})
    if: ${{ !inputs.release }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: linux-x64-musl, runner: ubuntu-latest, image: 'alpine:3.22', setup: 'apk add --no-cache libstdc++' }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, image: 'alpine:3.22', setup: 'apk add --no-cache libstdc++' }
          - { target: linux-x64-glibc-217, runner: ubuntu-latest, image: 'quay.io/centos/centos:centos7', setup: 'true' }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: win-x64, runner: windows-latest }
          - { target: win-arm64, runner: windows-11-arm }
    steps:
      - name: Use runner scratch for temporary files
        if: ${{ runner.os != 'Windows' }}
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Preserve committed bytes on Windows
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ !matrix.image }}
        with:
          node-version: 24
      # Install, run, upgrade, roll back and uninstall this target's bundle in a throwaway home.
      - name: Take the bundle through its life
        if: ${{ !matrix.image }}
        env:
          RELEASE: ${{ runner.temp }}/release
        run: node scripts/release/smoke.mjs "$RELEASE/assets"
      # A distribution with no Node of its own: the bundle's Node runs the same script inside the container.
      - name: Take the bundle through its life in ${{ matrix.image }}
        if: ${{ matrix.image }}
        env:
          RELEASE: ${{ runner.temp }}/release
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RELEASE:/release:ro" -e TARGET -e SETUP "$IMAGE" sh -euc '
            $SETUP
            mkdir /bundle
            tar -xzf /release/assets/pancode-*-"$TARGET".tar.gz -C /bundle
            /bundle/bin/node /src/scripts/release/smoke.mjs /release/assets
          '

  browser-smoke:
    name: browser smoke
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pancode-gui build
      # The fixture harness runs the checkout's CLI from source, so the smoke needs no root build.
      - name: Drive the GUI in the runner's Chrome
        run: pnpm --filter pancode-gui smoke:browser --chrome /usr/bin/google-chrome --out "$RUNNER_TEMP/browser-smoke"
      # --check fails on a behavior that must hold (draft kept, scroll held, live edge, whole answer, no page error);
      # frame, input and paint timings vary by runner and are kept as figures in the uploaded report.
      - name: Stream turns while typing and scrolling, checking what must not regress
        run: pnpm --filter pancode-gui perf --client dist/client --chrome /usr/bin/google-chrome --out "$RUNNER_TEMP/gui-perf" --label stream --check
      - name: Resume and page back through a 200-turn conversation
        run: pnpm --filter pancode-gui perf --client dist/client --chrome /usr/bin/google-chrome --out "$RUNNER_TEMP/gui-perf" --label history --history 200 --page-back --check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-perf-output
          path: ${{ runner.temp }}/gui-perf
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-output
          path: ${{ runner.temp }}/browser-smoke
          if-no-files-found: ignore
          retention-days: 14

  gui-api-smoke:
    name: gui api smoke
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app's server drives the built CLI as its ACP child, against a local OpenAI-compatible fixture.
      - run: pnpm run build
      - name: Open, stream, reload, configure and delete a conversation through the HTTP API
        run: pnpm --filter pancode-gui test:acp-real

  # A release dispatch starts here: the files to publish are the ones the push run of this commit built and
  # tested. No such run, or one that did not pass, stops the release before it asks for approval.
  tested-run:
    name: tested run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      artifact-id: ${{ steps.find.outputs.artifact-id }}
      sums: ${{ steps.check.outputs.sums }}
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Find the push run that built and tested this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/tested-run.mjs find
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.find.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check the release against its SHA256SUMS and this commit
        id: check
        env:
          RELEASE: ${{ runner.temp }}/release
        run: node scripts/release/tested-run.mjs check "$RELEASE"

  publish:
    name: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    needs: tested-run
    # The owner's approval of this environment is the release decision; nothing above it can publish.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      # Reads the release artifact of the push run the tested-run job found.
      actions: read
      # npm trusted publishing and the attestations below both sign with this run's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.tested-run.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
          run-id: ${{ needs.tested-run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check these are the files the tested-run job checked
        env:
          RELEASE: ${{ runner.temp }}/release
          SUMS: ${{ needs.tested-run.outputs.sums }}
        run: node scripts/release/tested-run.mjs check "$RELEASE" --sums "$SUMS"
      # Build provenance for every release asset, verifiable with `gh attestation verify <file> --repo PanStudio/pancode`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/assets/*
      # The rulesets let only the pancode-release App create v* tags and fast-forward main, and its gh-pages
      # push triggers the Pages build; GITHUB_TOKEN can do none of the three.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: PanStudio
          repositories: pancode
          permission-contents: write
          permission-workflows: write
      # npm authenticates this job through trusted publishing; no npm token exists anywhere.
      - name: Publish to npm, GitHub, main and the website
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE: ${{ runner.temp }}/release
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          node scripts/release/publish.mjs "$RELEASE"
