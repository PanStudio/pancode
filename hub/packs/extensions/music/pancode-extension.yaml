id: music
name: Music
version: 0.1.0
description: Focus radio in a dock pane below PanCode, played by cliamp.
license: LicenseRef-PanCode-1.0
runtime:
  api: 2
  entrypoint: runtime/extension.ts
  commands:
    - name: music
      alias: music
      description: Show or hide the focus-radio pane; on, off, pause, next, status, station <name or url>, agent on|off.
  events: [pane_changed]
  ui: [status, toast]
  tools:
    - name: music
      description: >-
        Play, pause, skip or stop the operator's focus radio in PanCode's dock pane. action is on, pause, off,
        next or status. Works only after the operator ran /music agent on; otherwise it returns why it cannot.
      actionClass: execute
      inputSchema:
        type: object
        properties:
          action: { type: string, enum: [on, pause, off, next, status] }
        required: [action]
        additionalProperties: false
  state: { session: true, store: true }
  services: { embedding: false, pane: true }
  keys:
    - { key: alt+a, action: toggle, label: Music }
  config:
    - key: station
      type: string
      default: http://radio.cliamp.stream/lofi/stream
      description: The stream URL or station name /music on plays until /music station picks another.
  binaries:
    - name: cliamp
      version: 1.63.2
      license: MIT
      homepage: https://cliamp.stream
      env: [CLIAMP_CONFIG_DIR]
      downloads:
        linux-x64:
          url: https://github.com/bjarneo/cliamp/releases/download/v1.63.2/cliamp-linux-amd64
          sha256: b066832c84cb9dffcb126252dedb55a0ebcd13cbac95bbff103b111b88ce17c9
          archive: raw
        linux-arm64:
          url: https://github.com/bjarneo/cliamp/releases/download/v1.63.2/cliamp-linux-arm64
          sha256: 3be4ebe8806d2432b58afedd0fbdcb9522266b0204ab6cddb7f519f6ee33a8aa
          archive: raw
        darwin-x64:
          url: https://github.com/bjarneo/cliamp/releases/download/v1.63.2/cliamp-darwin-amd64
          sha256: e8595ba960be284cf6ab21a3dd34537a8ddca4fca4fd253f057e02379f608276
          archive: raw
        darwin-arm64:
          url: https://github.com/bjarneo/cliamp/releases/download/v1.63.2/cliamp-darwin-arm64
          sha256: e9786bcedb5c284a6c15b8d472b846e67e321ab9e95b688ef999de24baec6074
          archive: raw
        win32-x64:
          url: https://github.com/bjarneo/cliamp/releases/download/v1.63.2/cliamp-windows-amd64.exe
          sha256: bc72bb495fcf21e2d61b434a5fcd7c6c2848f09fd4f78cb4b6952a6d970f43a2
          archive: raw
      documents:
        - name: LICENSE
          url: https://raw.githubusercontent.com/bjarneo/cliamp/v1.63.2/LICENSE
          sha256: 57764ebae827c1c96dc5c1b74e2579ff34d3abcaabb54f5e5498fb2f612330cc
  permissions: { fs: { read: [store], write: [store] }, exec: false, net: true }
